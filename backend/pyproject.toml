[project]
name = "noname"
version = "1.0.0"
description = "Description."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "psycopg>=3.3.9",
    "psycopg-binary>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "pyjwt>=2.15.1",
    "ruff>=0.17.6",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
noname = "noname.main:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
