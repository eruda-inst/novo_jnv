[project]
name = "noname"
version = "1.0.0"
description = "Description."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "pydantic[email]>=2.14.4",
    "pydantic-settings>=2.16.3",
    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
noname = "noname.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
